{{- $dest := .Destination -}}
{{- /* Rewrite bare internal absolute paths (e.g. /projects/) to include baseURL */ -}}
{{- if and (strings.HasPrefix $dest "/") (not (strings.HasPrefix $dest "//")) -}}
  {{- $dest = strings.TrimPrefix "/" $dest | relURL -}}
{{- end -}}
<a
    href="{{ $dest | safeURL }}"
    {{ with .Title }}
        title="{{ . }}"
    {{ end }}
    {{ if and (strings.HasPrefix $dest "http") (not (strings.HasPrefix $dest (site.BaseURL | default ""))) }}
        target="_blank"
        rel="noopener"
    {{ end }}
>{{ .Text | safeHTML }}</a>
