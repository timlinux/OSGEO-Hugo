{{/* Experimental Site Ribbon */}}
<script>
    /* Re-apply a dismissal from earlier in this browsing session before
       the ribbon first paints. */
    try {
        if (sessionStorage.getItem('osgeo-ribbon-dismissed')) {
            document.documentElement.classList.add('ribbon-dismissed');
        }
    } catch (e) { /* storage unavailable — ribbon stays visible */ }
</script>
<div class="experimental-ribbon">
    <div class="experimental-ribbon-content">
        <span class="experimental-ribbon-icon">
            <i class="fa-solid fa-flask"></i>
        </span>
        <span class="experimental-ribbon-text">
            <strong>Experimental R&amp;D Site</strong> - This is an unofficial prototype.
            Visit <a href="https://www.osgeo.org" target="_blank" rel="noopener">osgeo.org</a> for the official site.
        </span>
        <button class="experimental-ribbon-close" onclick="document.documentElement.classList.add('ribbon-dismissed');try{sessionStorage.setItem('osgeo-ribbon-dismissed','1')}catch(e){}" aria-label="Dismiss notice">
            <i class="fa-solid fa-times"></i>
        </button>
    </div>
</div>
