baseURL = 'https://osgeo.org/'
publishDir = "public_prod"

[minify]
  minifyOutput = true

# Developer-only pages (the /dev/ section, e.g. the shortcode gallery)
# are never rendered in production builds. They remain visible on the
# local dev server, which uses the base config.toml only.
[[cascade]]
  [cascade._build]
    render = 'never'
    list = 'never'
  [cascade._target]
    path = '/dev/**'

[[cascade]]
  [cascade._build]
    render = 'never'
    list = 'never'
  [cascade._target]
    path = '/dev'
